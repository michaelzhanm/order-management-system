services:
  - type: web
    name: order-management-system
    env: node
    rootDir: .
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: my-secret-key-2026
      - key: DB_PATH
        value: /data/app.db
      - key: PORT
        value: 3000
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
