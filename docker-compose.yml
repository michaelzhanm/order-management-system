version: '3.8'

services:
  app:
    build: .
    container_name: order-management-system
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/app/data/app.db
      - JWT_SECRET=your-secret-key-change-me-2026
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/me"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Nginx 反向代理（可选，用于 HTTPS 和域名）
  nginx:
    image: nginx:alpine
    container_name: order-management-nginx
    ports:
      - "80:80"
      # 如需 HTTPS，取消下一行注释并配置证书
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # - ./ssl:/etc/nginx/ssl:ro  # HTTPS 证书目录
    depends_on:
      - app
    restart: unless-stopped
    profiles: ["web"]  # 仅在需要时启动：docker-compose --profile web up -d
